<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>에듀오케이 주간 시간표</title>
  <style>
    :root { --ink:#172033; --muted:#667085; --line:#ccd3df; --accent:#3157d5; --paper:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#eef1f6; font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; }
    .toolbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px; padding:12px 18px; background:rgba(255,255,255,.94); border-bottom:1px solid #dfe3ea; backdrop-filter:blur(10px); }
    .brand { margin-right:auto; font-weight:800; letter-spacing:-.03em; }
    .status { color:var(--muted); font-size:13px; }
    button,.file-label { appearance:none; border:0; border-radius:8px; padding:9px 13px; background:#e8ecf5; color:var(--ink); font:700 13px inherit; cursor:pointer; }
    button.primary { color:white; background:var(--accent); }
    .view-controls { display:flex; gap:6px; align-items:center; }
    .view-controls[hidden],.day-controls[hidden] { display:none; }
    .view-controls button.active,.day-controls button.active { color:white; background:#3157d5; }
    .day-controls { display:flex; flex-wrap:wrap; gap:6px; padding:10px 18px; background:#fff; border-bottom:1px solid #e4e7ec; }
    .day-controls button { padding:7px 11px; }
    .teacher-table th:first-child,.teacher-table td.time { width:18mm; }
    .teacher-table th { background:#e9efff; font-size:8pt; }
    .teacher-table .class-name::after { content:''; }
    .blocking-error { margin:12mm auto; width:90%; padding:8mm; border:2px solid #f04438; border-radius:12px; background:#fff1f0; color:#912018; }
    .blocking-error h2 { margin:0 0 3mm; color:#b42318; font-size:15pt; }
    .blocking-error ul { columns:2; margin:3mm 0 0; padding-left:6mm; }
    body.dragging::after { content:'EduOK XLS 파일을 여기에 놓으세요'; position:fixed; inset:18px; z-index:100; display:grid; place-items:center; border:4px dashed var(--accent); border-radius:18px; background:rgba(238,244,255,.94); color:var(--accent); font-size:24px; font-weight:800; pointer-events:none; }
    #file { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    main { padding:20px; }
    #pages { display:grid; gap:20px; }
    .paper { margin:auto; padding:5mm; background:var(--paper); box-shadow:0 12px 35px rgba(29,41,57,.16); overflow:hidden; }
    .paper.weekday { width:269mm; height:182mm; }
    .paper.weekend { width:182mm; height:269mm; }
    .print-head { display:flex; align-items:end; justify-content:space-between; margin:0 0 2mm; }
    h1 { margin:0; font-size:12pt; letter-spacing:-.03em; }
    h2 { margin:2mm 0 1mm; font-size:10pt; }
    .date { font-size:8pt; color:var(--muted); }
    .fit { transform-origin:top left; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:7.2pt; line-height:1.2; }
    .weekday table { font-size:7.7pt; }
    th,td { border:.25mm solid var(--line); vertical-align:top; padding:1.15mm; }
    th { background:#eff2f7; text-align:center; font-size:7pt; font-weight:800; }
    th:first-child,td.time { width:14mm; }
    th.sun { color:#d92d20; background:#fff1f0; } th.sat { color:#175cd3; background:#eef4ff; }
    td.time { background:#f7f8fa; text-align:center; vertical-align:middle; white-space:nowrap; font-weight:800; }
    .class-card { line-height:1.24; padding:.25mm .15mm; }
    .class-card + .class-card { border-top:.3mm dashed #98a2b3; margin-top:1.15mm; padding-top:1.15mm; }
    .class-name { color:#193cb8; font-weight:800; overflow-wrap:anywhere; }
    .teacher { color:#667085; font-size:.9em; margin-left:.4em; white-space:nowrap; }
    .students { display:inline; margin-left:1.4mm; color:#101828; }
    .student { display:inline-block; margin-right:1.5mm; white-space:nowrap; }
    .slot-source { display:inline; margin-right:1.1mm; color:#667085; font-size:.85em; font-weight:800; }
    .weekend-table th:first-child,.weekend-table td.time { width:22mm; }
    .weekend-table { font-size:7.5pt; }
    .empty { color:#98a2b3; text-align:center; }
    .message { padding:30mm 10mm; text-align:center; color:var(--muted); font-size:13px; }
    .drop-prompt { margin:18mm auto; width:82%; min-height:70mm; display:grid; place-items:center; padding:12mm; border:2px dashed #8da2e8; border-radius:14px; background:#f7f9ff; color:#3157d5; text-align:center; font-size:16px; font-weight:800; line-height:1.7; }
    .drop-prompt small { display:block; color:#667085; font-size:12px; font-weight:500; }
    .file-warning { display:block; margin-top:3mm; color:#d92d20; font-size:13px; font-weight:800; }
    @page weekdayPage { size:A4 landscape; margin:14mm; }
    @page weekendPage { size:A4 portrait; margin:14mm; }
    @media print {
      body { background:#fff; }
      .toolbar { display:none !important; }
      main { padding:0; }
      #pages { display:block; }
      .paper { margin:0; padding:0; box-shadow:none; overflow:hidden; break-after:page; page-break-after:always; }
      .paper.weekday { page:weekdayPage; width:269mm; height:182mm; }
      .paper.weekend { page:weekendPage; width:182mm; height:269mm; }
      .paper:last-child { break-after:auto; page-break-after:auto; }
      h1 { font-size:10pt; }
      h2 { font-size:9pt; }
      .print-head { margin-bottom:1.5mm; }
      table { font-size:7pt; }
      th { font-size:7.5pt; }
    }
    @media (max-width:900px) { main { overflow:auto; padding:10px; } .paper { margin:0; } .status { display:none; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="brand">에듀오케이 시간표 인쇄</div>
    <span class="status" id="status">시간표를 불러오는 중…</span>
    <div class="view-controls" id="viewControls" hidden>
      <button class="active" id="weeklyViewButton" type="button">반별 주간 시간표</button>
      <button id="dailyViewButton" type="button">강사별 주간 시간표</button>
    </div>
    <label class="file-label" for="file">새 XLS 선택</label>
    <input id="file" type="file" accept=".xls,.html,.htm,text/html">
    <button id="fitButton" type="button">페이지 맞춤</button>
    <button class="primary" id="pdfButton" type="button">PDF 새 탭에서 보기</button>
    <button class="primary" id="printButton" type="button">인쇄</button>
  </header>
  <nav class="day-controls" id="dayControls" aria-label="날짜 선택" hidden></nav>
  <main>
    <div id="pages"><section class="paper weekday"><div class="print-head"><h1>주간 시간표</h1></div><div class="fit"><div class="message">시간표를 불러오는 중입니다.</div></div></section></div>
  </main>
  <script>
    const DAYS = ['시간','일','월','화','수','목','금','토'];
    const pages = document.querySelector('#pages');
    const status = document.querySelector('#status');
    let loadedRows=null, loadedLabel='', currentMode='weekly', selectedDayIndex=1, outputBlocked=false;

    function decode(buffer) {
      try { return new TextDecoder('euc-kr').decode(buffer); }
      catch { return new TextDecoder().decode(buffer); }
    }

    function clean(text) { return text.replace(/\s+/g,' ').trim(); }

    function parseCell(td) {
      const classes = [];
      const bigs = [...td.querySelectorAll('big')];
      for (const big of bigs) {
        const name = clean(big.textContent);
        const nameFont = big.closest('font');
        const teacherFont = nameFont?.nextElementSibling;
        const teacher = teacherFont?.tagName === 'FONT' ? clean(teacherFont.textContent).replace(/^\(|\)$/g,'') : '';
        const students = [];
        let node = teacherFont?.nextSibling;
        while (node) {
          if (node.nodeType === 1 && node.querySelector?.('big')) break;
          if (node.nodeType === 1 && node.tagName === 'FONT') {
            const value = clean(node.textContent);
            if (value && value !== '○' && value !== '()') students.push(value.replace(/^○\s*/,''));
          }
          node = node.nextSibling;
        }
        if (students.length > 0) classes.push({ name, teacher, students });
      }
      return classes;
    }

    function parseSchedule(source) {
      const doc = new DOMParser().parseFromString(source, 'text/html');
      const rows = [...doc.querySelectorAll('table tr')];
      if (rows.length < 2) throw new Error('시간표 표를 찾지 못했습니다. EduOK에서 내려받은 주간 시간표 파일인지 확인해 주세요.');
      return rows.slice(1).map(tr => {
        const cells = [...tr.children].filter(el => el.tagName === 'TD');
        return { time:clean(cells[0]?.textContent || '').replace('시',''), days:cells.slice(1,8).map(parseCell) };
      }).filter(row => row.time);
    }

    function esc(value) { const el=document.createElement('span'); el.textContent=value; return el.innerHTML; }

    function tableHtml(rows) {
      const body = rows.map(row => `<tr><td class="time">${esc(row.time)}</td>${row.days.map(groups => `<td>${groups.length ? groups.map(group => `<div class="class-card"><div><span class="class-name">${esc(group.name)}</span>${group.teacher ? `<span class="teacher">(${esc(group.teacher)})</span>`:''}</div>${group.students.length ? `<div class="students">${group.students.map(name => `<span class="student">${esc(name)}</span>`).join('')}</div>`:''}</div>`).join('') : ''}</td>`).join('')}</tr>`).join('');
      return `<table aria-label="주간 시간표"><thead><tr>${DAYS.map((day,i)=>`<th class="${i===1?'sun':i===7?'sat':''}">${day}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
    }

    function toMinutes(time) {
      const [hourText,minuteText='0']=time.split(':');
      let hour=Number(hourText), minute=Number(minuteText);
      if(hour>=2 && hour<=8) hour+=12;
      return hour*60+minute;
    }

    function weekdayRows(rows) {
      const slots=[
        {label:'15시',start:15*60,end:15*60+30},
        {label:'15시 30분',start:15*60+30,end:16*60},
        {label:'16시',start:16*60,end:17*60},
        {label:'17시',start:17*60,end:17*60+30},
        {label:'17시 30분',start:17*60+30,end:18*60},
        {label:'18시',start:18*60,end:19*60},
        {label:'19시',start:19*60,end:20*60},
        {label:'20시',start:20*60,end:20*60+30},
        {label:'20시 30분',start:20*60+30,end:21*60}
      ];
      return slots.map(slot=>{
        const {start,end}=slot;
        const matching=rows.filter(row=>{const minute=toMinutes(row.time); return minute>=start && minute<end;});
        return {
          time:slot.label,
          days:Array.from({length:5},(_,day)=>matching.flatMap(row=>row.days[day+1].map(group=>({...group,sourceTime:row.time}))))
        };
      });
    }

    function datesFromFileName(fileName) {
      const match=fileName.match(/(20\d{2})[-_.](\d{2})[-_.](\d{2})/);
      if(!match) return null;
      const base=new Date(Date.UTC(Number(match[1]),Number(match[2])-1,Number(match[3])));
      const mondayOffset=(base.getUTCDay()+6)%7;
      const monday=new Date(base); monday.setUTCDate(base.getUTCDate()-mondayOffset);
      return Array.from({length:7},(_,index)=>{const date=new Date(monday); date.setUTCDate(monday.getUTCDate()+index); return `${date.getUTCMonth()+1}/${date.getUTCDate()}`;});
    }

    function weekdayTableHtml(rows,weekDates) {
      const body=rows.map(row=>`<tr><td class="time">${esc(row.time)}</td>${row.days.map(groups=>`<td>${groups.map(group=>`<div class="class-card"><div><span class="slot-source">${esc(group.sourceTime)}</span><span class="class-name">${esc(group.name)}</span>${group.teacher?`<span class="teacher">(${esc(group.teacher)})</span>`:''}</div>${group.students.length?`<div class="students">${group.students.map(name=>`<span class="student">${esc(name)}</span>`).join('')}</div>`:''}</div>`).join('')}</td>`).join('')}</tr>`).join('');
      const dayNames=['월','화','수','목','금'];
      const headers=['시간',...dayNames.map((day,index)=>weekDates?`${day} ${weekDates[index]}`:day)];
      return `<table aria-label="평일 시간표"><thead><tr>${headers.map(day=>`<th>${day}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
    }

    function weekendTableHtml(rows,dayIndex,dayName,dateLabel='') {
      const filtered=rows.map(row=>({time:row.time,groups:row.days[dayIndex]})).filter(row=>row.groups.length);
      const body=filtered.map(row=>`<tr><td class="time">${esc(row.time)}</td><td>${row.groups.map(group=>`<div class="class-card"><div><span class="class-name">${esc(group.name)}</span>${group.teacher?`<span class="teacher">(${esc(group.teacher)})</span>`:''}</div>${group.students.length?`<div class="students">${group.students.map(name=>`<span class="student">${esc(name)}</span>`).join('')}</div>`:''}</div>`).join('')}</td></tr>`).join('');
      return `<table class="weekend-table" aria-label="${dayName} 시간표"><thead><tr><th>시간</th><th>${dayName}${dateLabel?` ${dateLabel}`:''}</th></tr></thead><tbody>${body}</tbody></table>`;
    }

    function combinedWeekendHtml(rows,weekDates) {
      return `<h2>토요일${weekDates?` · ${weekDates[5]}`:''}</h2>${weekendTableHtml(rows,6,'토요일',weekDates?.[5])}<h2>일요일${weekDates?` · ${weekDates[6]}`:''}</h2>${weekendTableHtml(rows,0,'일요일',weekDates?.[6])}`;
    }

    function renderWeekly(rows, label='') {
      outputBlocked=false;
      const weekDates=datesFromFileName(label);
      const sections=[
        {kind:'weekday',title:'평일 · 월–금 · 15–17시 30분',html:weekdayTableHtml(weekdayRows(rows).slice(0,5),weekDates)},
        {kind:'weekday',title:'평일 · 월–금 · 18–20시 30분',html:weekdayTableHtml(weekdayRows(rows).slice(5),weekDates)},
        {kind:'weekend',title:'주말 시간표 · 토요일 / 일요일',html:combinedWeekendHtml(rows,weekDates)}
      ];
      pages.innerHTML=sections.map((section,index)=>`<section class="paper ${section.kind}"><div class="print-head"><h1>${section.title} <small>${index+1}/3</small></h1><div class="date">${esc(label)}</div></div><div class="fit">${section.html}</div></section>`).join('');
      status.textContent = `평일 가로 2장·주말 세로 1장`;
      requestAnimationFrame(scaleToPages);
    }

    function missingTeacherClasses(rows,label='') {
      const missing=[];
      const weekDates=datesFromFileName(label);
      rows.forEach(row=>row.days.forEach((groups,dayIndex)=>groups.forEach(group=>{
        if(group.students.length&&!group.teacher) missing.push(`${dayDateLabel(dayIndex,weekDates)} · ${row.time} · ${group.name}`);
      })));
      return [...new Set(missing)];
    }

    function dayDateLabel(dayIndex,weekDates) {
      if(!weekDates) return DAYS[dayIndex+1] || '';
      const date=dayIndex===0?weekDates[6]:weekDates[dayIndex-1];
      return `${date} (${['일','월','화','수','목','금','토'][dayIndex]})`;
    }

    function renderDayControls() {
      const controls=document.querySelector('#dayControls');
      controls.innerHTML='';
      controls.hidden=true;
    }

    function teacherDayTableHtml(rows,dayIndex) {
      const dayRows=rows.map(row=>({time:row.time,groups:row.days[dayIndex]})).filter(row=>row.groups.length);
      const teachers=[...new Set(dayRows.flatMap(row=>row.groups.map(group=>group.teacher)))].sort((a,b)=>a.localeCompare(b,'ko'));
      const body=dayRows.map(row=>`<tr><td class="time">${esc(row.time)}</td>${teachers.map(teacher=>{const groups=row.groups.filter(group=>group.teacher===teacher); return `<td>${groups.map(group=>`<div class="class-card"><div><span class="class-name">${esc(group.name)}</span></div><div class="students">${group.students.map(name=>`<span class="student">${esc(name)}</span>`).join('')}</div></div>`).join('')}</td>`;}).join('')}</tr>`).join('');
      return `<table class="teacher-table" aria-label="강사별 주간 시간표의 하루 페이지"><thead><tr><th>시간</th>${teachers.map(teacher=>`<th>${esc(teacher)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
    }

    function renderDaily(rows,label='') {
      const weekDates=datesFromFileName(label), missing=missingTeacherClasses(rows,label);
      if(missing.length) {
        outputBlocked=true;
        pages.innerHTML=`<section class="paper weekday"><div class="print-head"><h1>강사별 주간 시간표</h1><div class="date">${esc(label)}</div></div><div class="blocking-error"><h2>강사명이 없는 수업이 있어 시간표를 출력할 수 없습니다.</h2><p>EduOK에서 아래 수업에 강사를 지정한 뒤 파일을 다시 내려받아 주세요.</p><ul>${missing.map(name=>`<li>${esc(name)}</li>`).join('')}</ul></div></section>`;
        status.textContent=`강사명 누락 ${missing.length}개 · PDF 및 인쇄 불가`;
      } else {
        outputBlocked=false;
        const dayIndexes=[1,2,3,4,5,6,0];
        pages.innerHTML=dayIndexes.map((dayIndex,index)=>{
          const dateLabel=dayDateLabel(dayIndex,weekDates);
          return `<section class="paper weekday"><div class="print-head"><h1>강사별 주간 시간표 · ${esc(dateLabel)} <small>${index+1}/7</small></h1><div class="date">${esc(label)}</div></div><div class="fit">${teacherDayTableHtml(rows,dayIndex)}</div></section>`;
        }).join('');
        status.textContent='강사별 주간 시간표 · 월–일 7장 · 하루 1페이지 · A4 가로';
        requestAnimationFrame(scaleToPages);
      }
    }

    function renderCurrent() {
      if(!loadedRows) return;
      if(currentMode==='daily') renderDaily(loadedRows,loadedLabel); else renderWeekly(loadedRows,loadedLabel);
      document.querySelector('#weeklyViewButton').classList.toggle('active',currentMode==='weekly');
      document.querySelector('#dailyViewButton').classList.toggle('active',currentMode==='daily');
      renderDayControls();
    }

    function scaleToPages() {
      const scales=[];
      document.querySelectorAll('.paper').forEach(paper=>{
        const fit=paper.querySelector('.fit'); if(!fit) return;
        fit.style.transform='none'; fit.style.width='100%';
        const maxHeight=paper.clientHeight-paper.querySelector('.print-head').offsetHeight-12;
        const scale=Math.min(1,maxHeight/fit.scrollHeight*.96); scales.push(scale);
        fit.style.transform=`scale(${scale})`; fit.style.width=`${100/scale}%`;
      });
      if(scales.length>1) status.textContent=`${status.textContent.split(' · 맞춤')[0]} · 맞춤 ${scales.map(v=>Math.round(v*100)+'%').join(' / ')}`;
    }

    function showFilePrompt() {
      pages.innerHTML = '<section class="paper weekday"><div class="print-head"><h1>주간 시간표</h1></div><div class="fit"><div class="drop-prompt"><div>EduOK XLS 파일을 이곳에 드래그 앤 드롭하세요<small>또는 위의 ‘새 XLS 선택’ 버튼을 눌러 주세요.<br>파일은 서버로 전송되지 않고 이 브라우저에서만 처리됩니다.</small><span class="file-warning">요일별 날짜 계산을 위해 EduOK에서 받은 파일 이름을 수정하지 마세요.</span></div></div></div></section>';
      status.textContent='EduOK XLS 파일을 선택해 주세요';
      document.querySelector('#viewControls').hidden=true;
      document.querySelector('#dayControls').hidden=true;
    }

    function bytes(value) { return new TextEncoder().encode(value); }

    function joinBytes(parts) {
      const length=parts.reduce((sum,part)=>sum+part.length,0), result=new Uint8Array(length);
      let offset=0; for(const part of parts){ result.set(part,offset); offset+=part.length; }
      return result;
    }

    function transformScale(element) {
      const fit=element.closest('.fit'); if(!fit) return 1;
      const match=getComputedStyle(fit).transform.match(/^matrix\(([^,]+)/);
      return match?Number(match[1]):1;
    }

    function drawText(context,element,pageRect,pixelRatio) {
      const value=element.textContent.trim(); if(!value) return;
      const rect=element.getBoundingClientRect(), style=getComputedStyle(element), scale=transformScale(element);
      const fontSize=parseFloat(style.fontSize)*scale*pixelRatio;
      context.font=`${style.fontWeight} ${fontSize}px ${style.fontFamily}`;
      context.fillStyle=style.color || '#172033'; context.textBaseline='top';
      const x=(rect.left-pageRect.left)*pixelRatio, y=(rect.top-pageRect.top)*pixelRatio;
      const maxWidth=Math.max(1,rect.width*pixelRatio);
      if(element.matches('th,td.time')) {
        context.textAlign='center'; context.fillText(value,x+maxWidth/2,y+Math.max(0,(rect.height*pixelRatio-fontSize)/2),maxWidth); context.textAlign='left'; return;
      }
      if(!element.classList.contains('class-name')) { context.fillText(value,x,y,maxWidth); return; }
      const words=[...value], lines=[]; let line='';
      for(const word of words){ const trial=line+word; if(line && context.measureText(trial).width>maxWidth){lines.push(line); line=word;} else line=trial; }
      if(line) lines.push(line);
      lines.slice(0,Math.max(1,Math.floor(rect.height*pixelRatio/(fontSize*1.15)))).forEach((text,index)=>context.fillText(text,x,y+index*fontSize*1.15,maxWidth));
    }

    async function elementToJpeg(element) {
      const pixelRatio=2, width=element.clientWidth, height=element.clientHeight;
      const canvas=document.createElement('canvas'); canvas.width=width*pixelRatio; canvas.height=height*pixelRatio;
      const context=canvas.getContext('2d'), pageRect=element.getBoundingClientRect();
      context.fillStyle='#fff'; context.fillRect(0,0,canvas.width,canvas.height);
      element.querySelectorAll('th,td').forEach(cell=>{
        const rect=cell.getBoundingClientRect(), style=getComputedStyle(cell);
        const x=(rect.left-pageRect.left)*pixelRatio, y=(rect.top-pageRect.top)*pixelRatio, w=rect.width*pixelRatio, h=rect.height*pixelRatio;
        context.fillStyle=style.backgroundColor==='rgba(0, 0, 0, 0)'?'#fff':style.backgroundColor; context.fillRect(x,y,w,h);
        context.strokeStyle='#ccd3df'; context.lineWidth=.7; context.strokeRect(x,y,w,h);
      });
      context.save(); context.strokeStyle='#98a2b3'; context.lineWidth=1.2; context.setLineDash([5,4]);
      element.querySelectorAll('.class-card + .class-card').forEach(card=>{
        const rect=card.getBoundingClientRect(), x=(rect.left-pageRect.left)*pixelRatio, y=(rect.top-pageRect.top)*pixelRatio;
        context.beginPath(); context.moveTo(x,y); context.lineTo(x+rect.width*pixelRatio,y); context.stroke();
      });
      context.restore();
      element.querySelectorAll('h1,h2,.date,th,td.time,.slot-source,.class-name,.teacher,.student').forEach(item=>drawText(context,item,pageRect,pixelRatio));
      const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.95));
      if(!blob) throw new Error('PDF용 이미지를 만들지 못했습니다.');
      return {data:new Uint8Array(await blob.arrayBuffer()),width:canvas.width,height:canvas.height};
    }

    function buildPdf(images) {
      const objectCount=2+images.length*3, objects=new Array(objectCount+1);
      objects[1]=bytes('<< /Type /Catalog /Pages 2 0 R >>');
      const pageRefs=images.map((_,index)=>`${3+index*3} 0 R`).join(' ');
      objects[2]=bytes(`<< /Type /Pages /Kids [${pageRefs}] /Count ${images.length} >>`);
      images.forEach((image,index)=>{
        const pageObject=3+index*3, imageObject=pageObject+1, contentObject=pageObject+2;
        const landscape=image.landscape, pageWidth=landscape?841.89:595.28, pageHeight=landscape?595.28:841.89, margin=34.02;
        const ratio=Math.min((pageWidth-margin*2)/image.width,(pageHeight-margin*2)/image.height);
        const drawWidth=image.width*ratio, drawHeight=image.height*ratio, x=(pageWidth-drawWidth)/2, y=(pageHeight-drawHeight)/2;
        const content=bytes(`q ${drawWidth.toFixed(2)} 0 0 ${drawHeight.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`);
        objects[pageObject]=bytes(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /XObject << /Im0 ${imageObject} 0 R >> >> /Contents ${contentObject} 0 R >>`);
        objects[imageObject]=joinBytes([bytes(`<< /Type /XObject /Subtype /Image /Width ${image.width} /Height ${image.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${image.data.length} >>\nstream\n`),image.data,bytes('\nendstream')]);
        objects[contentObject]=joinBytes([bytes(`<< /Length ${content.length} >>\nstream\n`),content,bytes('\nendstream')]);
      });
      const parts=[bytes('%PDF-1.4\n%âãÏÓ\n')], offsets=new Array(objectCount+1).fill(0); let position=parts[0].length;
      for(let index=1;index<=objectCount;index++){ offsets[index]=position; const part=joinBytes([bytes(`${index} 0 obj\n`),objects[index],bytes('\nendobj\n')]); parts.push(part); position+=part.length; }
      const xrefPosition=position;
      let xref=`xref\n0 ${objectCount+1}\n0000000000 65535 f \n`;
      for(let index=1;index<=objectCount;index++) xref+=`${String(offsets[index]).padStart(10,'0')} 00000 n \n`;
      parts.push(bytes(`${xref}trailer\n<< /Size ${objectCount+1} /Root 1 0 R >>\nstartxref\n${xrefPosition}\n%%EOF`));
      return new Blob(parts,{type:'application/pdf'});
    }

    async function createPdfBlob() {
      if(outputBlocked) throw new Error('강사명이 없는 수업 때문에 이 시간표를 출력할 수 없습니다.');
      scaleToPages();
      const pageElements=[...document.querySelectorAll('.paper')];
      if(!loadedRows||!pageElements.length) throw new Error('먼저 EduOK XLS 파일을 선택해 주세요.');
      const images=[]; for(const element of pageElements) images.push({...await elementToJpeg(element),landscape:element.classList.contains('weekday')});
      return buildPdf(images);
    }

    async function openPdfInNewTab() {
      const pdfTab=window.open('','_blank');
      if(!pdfTab) { alert('새 탭이 차단되었습니다. 이 사이트의 팝업을 허용한 뒤 다시 눌러 주세요.'); return; }
      pdfTab.document.write('<!doctype html><meta charset="utf-8"><title>PDF 생성 중</title><style>body{font-family:sans-serif;padding:40px;text-align:center;color:#344054}</style><p>시간표 PDF를 생성하고 있습니다…</p>');
      try {
        const url=URL.createObjectURL(await createPdfBlob());
        pdfTab.location.replace(url);
        setTimeout(()=>URL.revokeObjectURL(url),120000);
      } catch(error) {
        pdfTab.document.body.innerHTML=`<p>PDF 생성에 실패했습니다.</p><p>${esc(error.message)}</p>`;
      }
    }

    async function printPdf() {
      const button=document.querySelector('#printButton'), original=button.textContent;
      button.disabled=true; button.textContent='PDF 생성 중…';
      try {
        const url=URL.createObjectURL(await createPdfBlob());
        const frame=document.createElement('iframe');
        frame.style.cssText='position:fixed;width:1px;height:1px;right:0;bottom:0;border:0;opacity:0';
        frame.onload=()=>{ try { frame.contentWindow.focus(); frame.contentWindow.print(); } finally { setTimeout(()=>{frame.remove();URL.revokeObjectURL(url);},120000); } };
        frame.src=url; document.body.appendChild(frame);
      } catch(error) { alert(`인쇄용 PDF 생성에 실패했습니다.\n${error.message}`); }
      finally { button.disabled=false; button.textContent=original; }
    }

    async function loadScheduleFile(file) {
      if(!file) return;
      if(!/\.(xls|html?|htm)$/i.test(file.name)) { alert('EduOK에서 내려받은 .xls 파일을 선택해 주세요.'); return; }
      try {
        loadedRows=parseSchedule(decode(await file.arrayBuffer())); loadedLabel=file.name; currentMode='weekly'; selectedDayIndex=1;
        document.querySelector('#viewControls').hidden=false; renderCurrent();
      }
      catch(error) { alert(error.message); }
    }

    document.querySelector('#file').addEventListener('change', event => loadScheduleFile(event.target.files[0]));
    let dragDepth=0;
    window.addEventListener('dragenter', event=>{ event.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
    window.addEventListener('dragover', event=>{ event.preventDefault(); if(event.dataTransfer) event.dataTransfer.dropEffect='copy'; });
    window.addEventListener('dragleave', event=>{ event.preventDefault(); dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) document.body.classList.remove('dragging'); });
    window.addEventListener('drop', event=>{ event.preventDefault(); dragDepth=0; document.body.classList.remove('dragging'); loadScheduleFile(event.dataTransfer?.files?.[0]); });
    document.querySelector('#fitButton').addEventListener('click', scaleToPages);
    document.querySelector('#weeklyViewButton').addEventListener('click',()=>{currentMode='weekly';renderCurrent();});
    document.querySelector('#dailyViewButton').addEventListener('click',()=>{currentMode='daily';renderCurrent();});
    document.querySelector('#pdfButton').addEventListener('click', openPdfInNewTab);
    document.querySelector('#printButton').addEventListener('click', printPdf);
    window.addEventListener('resize', scaleToPages);
    showFilePrompt();
  </script>
</body>
</html>
