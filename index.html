<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>에듀오케이 주간 시간표</title>
  <style>
    :root { --ink:#172033; --muted:#667085; --line:#ccd3df; --accent:#3157d5; --paper:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#eef1f6; font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; }
    .toolbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px; padding:12px 18px; background:rgba(255,255,255,.94); border-bottom:1px solid #dfe3ea; backdrop-filter:blur(10px); }
    .brand { margin-right:auto; font-weight:800; letter-spacing:-.03em; }
    .status { color:var(--muted); font-size:13px; }
    button,.file-label { appearance:none; border:0; border-radius:8px; padding:9px 13px; background:#e8ecf5; color:var(--ink); font:700 13px inherit; cursor:pointer; }
    button.primary { color:white; background:var(--accent); }
    #file { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    main { padding:20px; }
    #pages { display:grid; gap:20px; }
    .paper { margin:auto; padding:5mm; background:var(--paper); box-shadow:0 12px 35px rgba(29,41,57,.16); overflow:hidden; }
    .paper.weekday { width:273mm; height:186mm; }
    .paper.weekend { width:186mm; height:273mm; }
    .print-head { display:flex; align-items:end; justify-content:space-between; margin:0 0 2mm; }
    h1 { margin:0; font-size:12pt; letter-spacing:-.03em; }
    h2 { margin:2mm 0 1mm; font-size:10pt; }
    .date { font-size:8pt; color:var(--muted); }
    .fit { transform-origin:top left; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:7.2pt; line-height:1.2; }
    th,td { border:.25mm solid var(--line); vertical-align:top; padding:.7mm; }
    th { background:#eff2f7; text-align:center; font-size:7pt; font-weight:800; }
    th:first-child,td.time { width:14mm; }
    th.sun { color:#d92d20; background:#fff1f0; } th.sat { color:#175cd3; background:#eef4ff; }
    td.time { background:#f7f8fa; text-align:center; vertical-align:middle; white-space:nowrap; font-weight:800; }
    .class-card + .class-card { border-top:.25mm dashed #bbc3d0; margin-top:.7mm; padding-top:.7mm; }
    .class-name { color:#193cb8; font-weight:800; overflow-wrap:anywhere; }
    .teacher { color:#667085; font-size:.9em; margin-left:.4em; white-space:nowrap; }
    .students { display:flex; flex-wrap:wrap; gap:.1mm 1.2mm; margin-top:.35mm; color:#101828; }
    .student { white-space:nowrap; }
    .slot-source { display:block; margin-bottom:.5mm; color:#667085; font-size:.85em; font-weight:800; }
    .weekend-table th:first-child,.weekend-table td.time { width:22mm; }
    .weekend-table { font-size:7.5pt; }
    .empty { color:#98a2b3; text-align:center; }
    .message { padding:30mm 10mm; text-align:center; color:var(--muted); font-size:13px; }
    @page weekdayPage { size:A4 landscape; margin:12mm; }
    @page weekendPage { size:A4 portrait; margin:12mm; }
    @media print {
      body { background:#fff; }
      .toolbar { display:none !important; }
      main { padding:0; }
      #pages { display:block; }
      .paper { margin:0; padding:0; box-shadow:none; overflow:hidden; break-after:page; page-break-after:always; }
      .paper.weekday { page:weekdayPage; width:273mm; height:186mm; }
      .paper.weekend { page:weekendPage; width:186mm; height:273mm; }
      .paper:last-child { break-after:auto; page-break-after:auto; }
      h1 { font-size:10pt; }
      h2 { font-size:9pt; }
      .print-head { margin-bottom:1.5mm; }
      table { font-size:7pt; }
      th { font-size:7.5pt; }
    }
    @media (max-width:900px) { main { overflow:auto; padding:10px; } .paper { margin:0; } .status { display:none; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="brand">에듀오케이 시간표 인쇄</div>
    <span class="status" id="status">시간표를 불러오는 중…</span>
    <label class="file-label" for="file">새 XLS 선택</label>
    <input id="file" type="file" accept=".xls,.html,.htm,text/html">
    <button id="fitButton" type="button">페이지 맞춤</button>
    <button class="primary" id="printButton" type="button">A4 3장 인쇄</button>
  </header>
  <main>
    <div id="pages"><section class="paper weekday"><div class="print-head"><h1>주간 시간표</h1></div><div class="fit"><div class="message">시간표를 불러오는 중입니다.</div></div></section></div>
  </main>
  <script>
    const DAYS = ['시간','일','월','화','수','목','금','토'];
    const pages = document.querySelector('#pages');
    const status = document.querySelector('#status');

    function decode(buffer) {
      try { return new TextDecoder('euc-kr').decode(buffer); }
      catch { return new TextDecoder().decode(buffer); }
    }

    function clean(text) { return text.replace(/\s+/g,' ').trim(); }

    function parseCell(td) {
      const classes = [];
      const bigs = [...td.querySelectorAll('big')];
      for (const big of bigs) {
        const name = clean(big.textContent);
        const nameFont = big.closest('font');
        const teacherFont = nameFont?.nextElementSibling;
        const teacher = teacherFont?.tagName === 'FONT' ? clean(teacherFont.textContent).replace(/^\(|\)$/g,'') : '';
        const students = [];
        let node = teacherFont?.nextSibling;
        while (node) {
          if (node.nodeType === 1 && node.querySelector?.('big')) break;
          if (node.nodeType === 1 && node.tagName === 'FONT') {
            const value = clean(node.textContent);
            if (value && value !== '○' && value !== '()') students.push(value.replace(/^○\s*/,''));
          }
          node = node.nextSibling;
        }
        classes.push({ name, teacher, students });
      }
      return classes;
    }

    function parseSchedule(source) {
      const doc = new DOMParser().parseFromString(source, 'text/html');
      const rows = [...doc.querySelectorAll('table tr')];
      if (rows.length < 2) throw new Error('시간표 표를 찾지 못했습니다. EduOK에서 내려받은 주간 시간표 파일인지 확인해 주세요.');
      return rows.slice(1).map(tr => {
        const cells = [...tr.children].filter(el => el.tagName === 'TD');
        return { time:clean(cells[0]?.textContent || '').replace('시',''), days:cells.slice(1,8).map(parseCell) };
      }).filter(row => row.time);
    }

    function esc(value) { const el=document.createElement('span'); el.textContent=value; return el.innerHTML; }

    function tableHtml(rows) {
      const body = rows.map(row => `<tr><td class="time">${esc(row.time)}</td>${row.days.map(groups => `<td>${groups.length ? groups.map(group => `<div class="class-card"><div><span class="class-name">${esc(group.name)}</span>${group.teacher ? `<span class="teacher">(${esc(group.teacher)})</span>`:''}</div>${group.students.length ? `<div class="students">${group.students.map(name => `<span class="student">${esc(name)}</span>`).join('')}</div>`:''}</div>`).join('') : ''}</td>`).join('')}</tr>`).join('');
      return `<table aria-label="주간 시간표"><thead><tr>${DAYS.map((day,i)=>`<th class="${i===1?'sun':i===7?'sat':''}">${day}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
    }

    function toMinutes(time) {
      const [hourText,minuteText='0']=time.split(':');
      let hour=Number(hourText), minute=Number(minuteText);
      if(hour>=2 && hour<=8) hour+=12;
      return hour*60+minute;
    }

    function weekdayRows(rows) {
      return Array.from({length:6},(_,index)=>{
        const hour=15+index, start=hour*60, end=start+60;
        const matching=rows.filter(row=>{const minute=toMinutes(row.time); return minute>=start && minute<end;});
        return {
          time:`${hour}시`,
          days:Array.from({length:5},(_,day)=>matching.flatMap(row=>row.days[day+1].map(group=>({...group,sourceTime:row.time}))))
        };
      });
    }

    function weekdayTableHtml(rows) {
      const body=rows.map(row=>`<tr><td class="time">${esc(row.time)}</td>${row.days.map(groups=>`<td>${groups.map(group=>`<div class="class-card"><div><span class="slot-source">${esc(group.sourceTime)}</span><span class="class-name">${esc(group.name)}</span>${group.teacher?`<span class="teacher">(${esc(group.teacher)})</span>`:''}</div>${group.students.length?`<div class="students">${group.students.map(name=>`<span class="student">${esc(name)}</span>`).join('')}</div>`:''}</div>`).join('')}</td>`).join('')}</tr>`).join('');
      return `<table aria-label="평일 시간표"><thead><tr>${['시간','월','화','수','목','금'].map(day=>`<th>${day}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
    }

    function weekendTableHtml(rows,dayIndex,dayName) {
      const filtered=rows.map(row=>({time:row.time,groups:row.days[dayIndex]})).filter(row=>row.groups.length);
      const body=filtered.map(row=>`<tr><td class="time">${esc(row.time)}</td><td>${row.groups.map(group=>`<div class="class-card"><div><span class="class-name">${esc(group.name)}</span>${group.teacher?`<span class="teacher">(${esc(group.teacher)})</span>`:''}</div>${group.students.length?`<div class="students">${group.students.map(name=>`<span class="student">${esc(name)}</span>`).join('')}</div>`:''}</div>`).join('')}</td></tr>`).join('');
      return `<table class="weekend-table" aria-label="${dayName} 시간표"><thead><tr><th>시간</th><th>${dayName}</th></tr></thead><tbody>${body}</tbody></table>`;
    }

    function combinedWeekendHtml(rows) {
      return `<h2>토요일</h2>${weekendTableHtml(rows,6,'토요일')}<h2>일요일</h2>${weekendTableHtml(rows,0,'일요일')}`;
    }

    function render(rows, label='') {
      const sections=[
        {kind:'weekday',title:'평일 · 월–금 · 15–17시',html:weekdayTableHtml(weekdayRows(rows).slice(0,3))},
        {kind:'weekday',title:'평일 · 월–금 · 18–20시',html:weekdayTableHtml(weekdayRows(rows).slice(3))},
        {kind:'weekend',title:'주말 시간표 · 토요일 / 일요일',html:combinedWeekendHtml(rows)}
      ];
      pages.innerHTML=sections.map((section,index)=>`<section class="paper ${section.kind}"><div class="print-head"><h1>${section.title} <small>${index+1}/3</small></h1><div class="date">${esc(label)}</div></div><div class="fit">${section.html}</div></section>`).join('');
      status.textContent = `평일 가로 2장·주말 세로 1장`;
      requestAnimationFrame(scaleToPages);
    }

    function scaleToPages() {
      const scales=[];
      document.querySelectorAll('.paper').forEach(paper=>{
        const fit=paper.querySelector('.fit'); fit.style.transform='none'; fit.style.width='100%';
        const maxHeight=paper.clientHeight-paper.querySelector('.print-head').offsetHeight-12;
        const scale=Math.min(1,maxHeight/fit.scrollHeight*.96); scales.push(scale);
        fit.style.transform=`scale(${scale})`; fit.style.width=`${100/scale}%`;
      });
      if(scales.length>1) status.textContent=`${status.textContent.split(' · 맞춤')[0]} · 맞춤 ${scales.map(v=>Math.round(v*100)+'%').join(' / ')}`;
    }

    function showFilePrompt() {
      pages.innerHTML = '<section class="paper weekday"><div class="print-head"><h1>주간 시간표</h1></div><div class="fit"><div class="message">위의 ‘새 XLS 선택’ 버튼을 눌러<br>EduOK 주간 시간표 파일을 불러와 주세요.<br><br>파일은 서버로 전송되지 않고 이 브라우저에서만 처리됩니다.</div></div></section>';
      status.textContent='EduOK XLS 파일을 선택해 주세요';
    }

    document.querySelector('#file').addEventListener('change', async event => {
      const file=event.target.files[0]; if(!file) return;
      try { render(parseSchedule(decode(await file.arrayBuffer())), file.name); }
      catch(error) { alert(error.message); }
    });
    document.querySelector('#fitButton').addEventListener('click', scaleToPages);
    document.querySelector('#printButton').addEventListener('click', () => { scaleToPages(); setTimeout(()=>window.print(),50); });
    window.addEventListener('resize', scaleToPages);
    showFilePrompt();
  </script>
</body>
</html>
